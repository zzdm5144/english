<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#163b3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>IPA Coach</title>
</head>
<body>
  <header><div><span class="eyebrow">ENGLISH PRONUNCIATION</span><h1>IPA Coach</h1></div><div id="azure-status" class="status">检查评分服务…</div></header>
  <main>
    <section class="hero">
      <div><p class="kicker">听清 · 说准 · 记住</p><h2>每天一小步，<br>让英语更自然。</h2><p>从音素到单词，使用真实 Azure Pronunciation Assessment 获取发音反馈。</p></div>
      <div class="progress-card"><div class="ring" id="progress-ring"><span id="progress-value">0%</span></div><p>总体课程进度</p></div>
    </section>
    <nav id="levels" aria-label="课程级别"></nav>
    <section class="lesson-grid" id="lessons" aria-live="polite"></section>
    <section class="practice" id="practice" hidden>
      <button class="close" id="close" aria-label="关闭练习">×</button>
      <p class="eyebrow" id="practice-level"></p><div class="prompt"><span id="practice-ipa"></span><h2 id="practice-text"></h2><p id="practice-hint"></p></div>
      <div class="actions"><button id="listen" class="secondary">▶ 标准发音</button><button id="record" class="primary">● 开始录音</button></div>
      <audio id="playback" controls hidden></audio>
      <button id="assess" class="assess" disabled>提交 Azure 评分</button>
      <div id="result" class="result" aria-live="polite"></div>
    </section>
  </main>
  <footer>学习记录仅保存在本机浏览器 · 录音仅在提交评分时发送到 Azure</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
